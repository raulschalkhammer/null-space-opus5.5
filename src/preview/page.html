<title>Jev Screening Room</title>
<style>
/* A single dark look on purpose: the film is night-blue, and it reads best on its own ground. */
:root {
	color-scheme: dark;
	--ground: #0B1030;
	--panel: #121A48;
	--panel-hi: #1B2766;
	--line: #2A377F;
	--text: #F6F4FF;
	--mute: #9AA2DD;
	--accent: #FF8A3D;
	--accent-ink: #2A1204;
	--scene: #2EE6C5;
	--ui: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
	--mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html, body { background: var(--ground); color: var(--text); }
body { font-family: var(--ui); font-size: 15px; padding-inline: 16px; padding-block: 12px 28px; }
.app { max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 900; letter-spacing: 0.02em; font-size: 17px; }
.brand-mark { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(255,138,61,0.22); }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { display: flex; align-items: center; gap: 8px; font: 800 14px var(--ui); color: var(--mute); background: transparent; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 6px; cursor: pointer; }
.tab:hover { color: var(--text); border-color: var(--panel-hi); }
.tab.on { color: var(--text); background: var(--panel-hi); border-color: var(--panel-hi); }
.tab-n { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--line); color: var(--text); font-size: 12px; }
.tab.on .tab-n { background: var(--accent); color: var(--accent-ink); }
.tab-len { font: 500 12px var(--mono); color: var(--mute); }
.stage { border-radius: 14px; overflow: hidden; background: #000; box-shadow: 0 18px 48px rgba(3,5,20,0.6); max-width: 100%; }
.strip { display: grid; gap: 6px; }
.lanes { position: relative; display: flex; gap: 2px; height: 40px; }
.lane { flex-basis: 0; min-width: 0; border: 0; border-radius: 6px; background: var(--panel); color: var(--mute); font: 800 12px var(--ui); cursor: pointer; overflow: hidden; padding: 0 6px; text-align: left; }
.lane.alt { background: #0F1740; }
.lane span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane:hover { color: var(--text); background: var(--panel-hi); }
.lane.on { background: rgba(46,230,197,0.16); color: var(--scene); box-shadow: inset 0 0 0 2px var(--scene); }
.head { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1px; border-radius: 2px; background: var(--accent); pointer-events: none; }
.scrub { width: 100%; accent-color: var(--accent); margin: 0; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.transport, .opts { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.btn { font: 800 14px var(--ui); color: var(--text); background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 7px 12px; cursor: pointer; min-width: 44px; }
.btn:hover { background: var(--panel-hi); }
.btn:focus-visible, .tab:focus-visible, .lane:focus-visible, select:focus-visible, .scrub:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.play { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); min-width: 84px; }
.btn.chip { border-radius: 999px; }
.btn.chip.on { border-color: var(--scene); color: var(--scene); }
.readout { display: flex; align-items: baseline; gap: 12px; font-variant-numeric: tabular-nums; }
.tc { font: 700 22px var(--mono); }
.sc { font-weight: 900; color: var(--scene); }
.fr { font: 500 12px var(--mono); color: var(--mute); }
.opt { display: flex; align-items: center; gap: 6px; font-weight: 800; color: var(--mute); font-size: 13px; }
select { font: 800 14px var(--ui); color: var(--text); background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 6px 8px; }
.note { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border-radius: 12px; padding: 12px 14px; }
.note-label { font-size: 11px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); }
.moment { font: 500 14px var(--mono); overflow-wrap: anywhere; user-select: all; }
.foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; color: var(--mute); font-size: 12px; }
@media (max-width: 560px) {
	.lane span { display: none; }
	.tc { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>
<div id="root"></div>
